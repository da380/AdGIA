[project]
name = "adgia-benchmarks"
version = "0.1.0"
description = "Benchmarks of AdGIA against radial reference solutions"
requires-python = ">=3.12"
dependencies = [
    "planetmodel[meshing,mfem]>=1.2.3",
    "pyslfp>=2.2.0",
    "matplotlib>=3.9.0",
    "scipy (>=1.13)",
    "mpmath (>=1.3)",
    "sympy (>=1.13)",
]

[tool.poetry]
package-mode = false
