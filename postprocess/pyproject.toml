[project]
name = "adgia-postprocess"
version = "0.1.0"
description = "Post-processing of AdGIA outputs: surface fields onto lon-lat grids, NetCDF, maps"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=1.26)",
    "scipy (>=1.13)",
    "matplotlib (>=3.9.0)",
    "netCDF4 (>=1.6)",
]

[project.optional-dependencies]
maps = [
    "cartopy (>=0.23)",
    "pyshtools (>=4.12)",
]

[tool.poetry]
package-mode = false
