[project]
name = "adgia-python"
version = "0.1.0"
description = "The Python tooling of AdGIA, one environment for all of it: mesh generation (meshes/), the benchmark scripts (benchmarks/) and the earth-data tools (earth_data/)"
requires-python = ">=3.12"
dependencies = [
    "planetmodel[meshing,mfem]>=1.2.3",
    "pyslfp (>=2.2.0)",
    "numpy (>=1.26)",
    "scipy (>=1.13)",
    "matplotlib (>=3.9.0)",
    "mpmath (>=1.3)",
    "sympy (>=1.13)",
    "netCDF4 (>=1.6)",
]

[project.optional-dependencies]
maps = [
    "cartopy (>=0.23)",
    "pyshtools (>=4.12)",
]

[tool.poetry]
package-mode = false
